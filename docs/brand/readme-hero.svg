<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">FinGuard</title>
<desc id="desc">FinGuard: an AI money agent that has to show its evidence before it acts. An approval card shows each value traced to its source, a code bound to one action, and a hash-chained log.</desc>
<defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Helvetica, Arial, sans-serif}
.wm{font-size:30px;font-weight:700;letter-spacing:-0.6px;fill:#0e1b19}
.wm2{font-size:30px;font-weight:700;letter-spacing:-0.6px;fill:#0b5e52}
.h1{font-size:50px;font-weight:700;letter-spacing:-1.1px;fill:#0e1b19}
.h1a{font-size:50px;font-weight:700;letter-spacing:-1.1px;fill:#0b5e52}
.sub{font-size:20px;font-weight:400;fill:#475467}
.meta{font-size:15px;font-weight:600;letter-spacing:0.2px;fill:#5f6b7a}
.metam{font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;font-size:15px;font-weight:500;fill:#475467}
.eyeask{font-size:12.5px;font-weight:700;letter-spacing:1.3px;fill:#a35a06}
.small3{font-size:14px;font-weight:500;fill:#5f6b7a}
.ctitle{font-size:23px;font-weight:700;letter-spacing:-0.3px;fill:#0e1b19}
.lbl{font-size:15px;font-weight:500;fill:#5f6b7a}
.val{font-size:17px;font-weight:600;fill:#0e1b19}
.chip-user-13_5{font-size:13.5px;font-weight:600;fill:#2456c4}
.chip-sys-13_5{font-size:13.5px;font-weight:600;fill:#0b6b5d}
.code{font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;font-size:36px;font-weight:600;letter-spacing:7px;fill:#0e1b19}
.codelbl{font-size:14px;font-weight:500;fill:#475467}
.hash{font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;font-size:15.5px;font-weight:600;fill:#0e1b19}
.eye3{font-size:12px;font-weight:700;letter-spacing:1.3px;fill:#5f6b7a}
.blk{font-size:12.5px;font-weight:500;fill:#5f6b7a}
.blkh{font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;font-size:14px;font-weight:600;fill:#0e1b19}
.blka{font-size:12.5px;font-weight:600;fill:#11734f}
</style>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.1" fill="#c9d5d1"/></pattern>
<linearGradient id="fade-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.45" stop-color="#fff" stop-opacity="1"/></linearGradient><mask id="fade"><rect x="560" y="0" width="720" height="640" fill="url(#fade-g)"/></mask>
<filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b2e29" flood-opacity="0.12"/><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b2e29" flood-opacity="0.06"/></filter>
<linearGradient id="fg-logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15997f"/><stop offset="1" stop-color="#063a33"/></linearGradient>
<marker id="ah-5f6b7a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5f6b7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="640" fill="#f4f7f6"/>
<rect x="560" y="0" width="720" height="640" fill="url(#dots)" mask="url(#fade)"/>
<g transform="translate(80 84) scale(0.109375)"><rect width="512" height="512" rx="116" fill="url(#fg-logo)"/><path d="M256 88 L392 138 V250 C392 338 332 402 256 430 C180 402 120 338 120 250 V138 Z" fill="none" stroke="#ffffff" stroke-width="30" stroke-linejoin="round"/><path d="M194 262 L240 308 L322 212" fill="none" stroke="#86e3c8" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="152" y="123" class="wm">Fin<tspan class="wm2">Guard</tspan></text>
<text x="80" y="262" class="h1">An AI money agent that</text>
<text x="80" y="322" class="h1">has to show its <tspan class="h1a">evidence</tspan></text>
<text x="80" y="382" class="h1">before it acts.</text>
<text x="80" y="444" class="sub">It traces every value to its source, binds each approval</text>
<text x="80" y="474" class="sub">code to one exact action, and writes every step to a</text>
<text x="80" y="504" class="sub">hash-chained log.</text>
<text x="80" y="560" class="meta">HackNC 2026</text>
<rect x="198.51" y="547" width="1" height="17" fill="#cfd7df"/>
<text x="215.51" y="560" class="metam">github.com/KuiyiGao/finguard</text>
<rect x="680" y="72" width="520" height="496" rx="18" fill="#ffffff" stroke="#dbe3e0" stroke-width="1" filter="url(#lift)"/>
<g transform="translate(712 105) scale(0.66667)" fill="none" stroke="#a35a06" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.5 2"/></g>
<text x="736" y="118" class="eyeask">NEEDS YOUR APPROVAL</text>
<text x="1168" y="118" class="small3" text-anchor="end">expires in 1:54</text>
<text x="712" y="160" class="ctitle">Pay Duke Energy $84.20 from Checking</text>
<rect x="712" y="182" width="456" height="1" fill="#e2e6eb"/>
<text x="712" y="221" class="lbl">Payee</text>
<text x="804" y="222" class="val">Duke Energy</text>
<g>
<rect x="1073.3" y="203" width="94.7" height="26" rx="13" fill="#e8eefc"/>
<g transform="translate(1083.02 208.5) scale(0.625)" fill="none" stroke="#2456c4" stroke-width="2.88" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21v-1.5A5.5 5.5 0 0 1 10 14h4a5.5 5.5 0 0 1 5.5 5.5V21"/></g>
<text x="1103.42" y="220.86" class="chip-user-13_5">You said</text>
</g>
<text x="712" y="263" class="lbl">From</text>
<text x="804" y="264" class="val">Checking</text>
<g>
<rect x="1049.14" y="245" width="118.86" height="26" rx="13" fill="#e1f1ed"/>
<g transform="translate(1058.86 250.5) scale(0.625)" fill="none" stroke="#0b6b5d" stroke-width="2.88" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5.5 18V10.5M10 18v-7.5M14 18v-7.5M18.5 18v-7.5"/><path d="M3 8.5 12 3l9 5.5z"/></g>
<text x="1079.26" y="262.86" class="chip-sys-13_5">Bank record</text>
</g>
<text x="712" y="305" class="lbl">Amount</text>
<text x="804" y="306" class="val">$84.20</text>
<g>
<rect x="1049.14" y="287" width="118.86" height="26" rx="13" fill="#e1f1ed"/>
<g transform="translate(1058.86 292.5) scale(0.625)" fill="none" stroke="#0b6b5d" stroke-width="2.88" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5.5 18V10.5M10 18v-7.5M14 18v-7.5M18.5 18v-7.5"/><path d="M3 8.5 12 3l9 5.5z"/></g>
<text x="1079.26" y="304.86" class="chip-sys-13_5">Bank record</text>
</g>
<rect x="712" y="324" width="456" height="1" fill="#e2e6eb"/>
<g>
<rect x="712" y="344" width="456" height="82" rx="12" fill="#f6f8f8" stroke="#e2e6eb" stroke-width="1"/>
<g transform="translate(732 373) scale(0.91667)" fill="none" stroke="#475467" stroke-width="2.18" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.8 12.2 9.7-9.7"/><path d="m16 7 3 3"/><path d="m18.5 4.5 2 2"/></g>
<text x="768" y="398" class="code">7131</text>
<rect x="884.7" y="362" width="1" height="46" fill="#cfd7df"/>
<text x="904.7" y="378" class="codelbl">Works for this one action</text>
<text x="904.7" y="404" class="codelbl">action hash <tspan class="hash">c6bc45fd</tspan></text>
</g>
<text x="712" y="462" class="eye3">HASH-CHAINED LOG</text>
<g>
<rect x="712" y="478" width="134" height="56" rx="10" fill="#ffffff" stroke="#cfd7df" stroke-width="1"/>
<text x="726" y="500" class="blk">approved</text>
<text x="726" y="521" class="blkh">4f1e9a07</text>
</g>
<path d="M850 506 L869 506" fill="none" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#ah-5f6b7a)" stroke-linecap="round"/>
<g>
<rect x="873" y="478" width="134" height="56" rx="10" fill="#ffffff" stroke="#cfd7df" stroke-width="1"/>
<text x="887" y="500" class="blk">bank.pay_bill</text>
<text x="887" y="521" class="blkh">a93c2d61</text>
</g>
<path d="M1011 506 L1030 506" fill="none" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#ah-5f6b7a)" stroke-linecap="round"/>
<g>
<rect x="1034" y="478" width="134" height="56" rx="10" fill="#e4f3eb" stroke="#b9dcc8" stroke-width="1"/>
<g transform="translate(1142 487) scale(0.625)" fill="none" stroke="#11734f" stroke-width="3.52" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6.5 9.5 17 4 11.5"/></g>
<text x="1048" y="500" class="blka">receipt</text>
<text x="1048" y="521" class="blkh">83e4efa0</text>
</g>
</svg>
