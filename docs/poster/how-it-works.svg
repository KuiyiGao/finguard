.monok{font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;font-size:14.5px;font-weight:500;fill:#5f6b7a}
.mnum{font-size:15px;font-weight:700;fill:#ffffff}
.chk{font-size:14.5px;font-weight:500;fill:#0e1b19}
.chkb{font-size:15px;font-weight:700;fill:#0b5e52}
.chip-user-13{font-size:13px;font-weight:600;fill:#2456c4}
.chip-sys-13{font-size:13px;font-weight:600;fill:#0b6b5d}
