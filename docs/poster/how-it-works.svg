.oa{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#11734f}
.oq{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#a35a06}
.od{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#c0352b}
.ob{font-size:15px;font-weight:400;fill:#0e1b19}
.obm{font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;font-size:14px;font-weight:600;fill:#0e1b19}
.ct{font-size:20px;font-weight:700;letter-spacing:-0.3px;fill:#0e1b19}
.cb{font-size:17px;font-weight:400;fill:#475467}
</style>
<filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b2e29" flood-opacity="0.07"/></filter>
<linearGradient id="fg-logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15997f"/><stop offset="1" stop-color="#063a33"/></linearGradient>
<marker id="ah-5f6b7a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#5f6b7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ah-11734f" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#11734f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ah-a35a06" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#a35a06" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ah-c0352b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#c0352b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
