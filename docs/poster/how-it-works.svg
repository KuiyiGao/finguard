<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">How FinGuard handles one request</title>
<desc id="desc">One request through FinGuard: a message, the agent's proposed tool call, SkillGate's checks, the allow, ask and deny outcomes, the bank adapter's permit, and the hash-chained receipt. Three checks are called out: provenance, approval binding and the bank-side permit.</desc>
<defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Helvetica, Arial, sans-serif}
.title{font-size:36px;font-weight:700;letter-spacing:-0.8px;fill:#0e1b19}
.sub{font-size:19px;font-weight:400;fill:#475467}
.wm{font-size:22px;font-weight:700;letter-spacing:-0.4px;fill:#0e1b19}
.wm2{font-size:22px;font-weight:700;letter-spacing:-0.4px;fill:#0b5e52}
