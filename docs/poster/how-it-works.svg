.eyeb{font-size:12.5px;font-weight:700;letter-spacing:1.4px;fill:#0b5e52}
.eyer{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#c0352b}
.eyeu{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#2456c4}
.body{font-size:16px;font-weight:400;fill:#0e1b19}
.body2{font-size:15px;font-weight:400;fill:#475467}
